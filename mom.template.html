<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>momentum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#060A17;color:#D5D9E1;font:14px/1.4 'Inter',-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 10px;border-bottom:1px solid rgba(161,165,179,.18);color:#81899F;font-size:12px;letter-spacing:.14em;font-weight:500}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:.06em;font-size:15px}
  .brand svg{height:30px;width:auto;color:#fff}
  .top{display:flex;align-items:center;gap:18px;padding:14px 22px 6px}
  .coin{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.01em}
  .call{font-size:18px;font-weight:800;padding:5px 14px;border-radius:2px;letter-spacing:.04em}
  .LONG{background:#49B875;color:#060A17}.SHORT{background:#DF2E2E;color:#fff}.NONE{background:#192843;color:#fff;border:1px solid #2E4164}
  .why{color:#81899F}
  table{border-collapse:collapse;margin:4px 22px 10px}
  td,th{padding:3px 12px;text-align:right}th{color:#697083;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
  .g{color:#49B875}.r{color:#F0494C}.y{color:#61B8FF}.d{color:#697083}
  .tag{padding:1px 8px;border-radius:2px;font-weight:700;font-size:12px;letter-spacing:.05em}
  .panels{display:flex;gap:10px;padding:0 16px}
  .p{flex:1;background:#0B1122;border:1px solid #192843;border-radius:2px;padding:6px}
  .p h3{margin:4px 6px 2px;font-size:14px;font-weight:700;color:#fff}
  .p h3 .d{font-weight:400}
  canvas{width:100%;height:440px;display:block}
  .foot{padding:8px 22px;color:#81899F;font-size:12.5px}
</style></head><body>
<div class="hdr"><span class="brand">/*LOGO*/<span>GEMACH</span></span><span>// GDEX PERPS / MOMENTUM</span></div>
<div class="top"><span class="coin" id="coin"></span><span class="call" id="call"></span><span class="why" id="why"></span></div>
<table id="board"></table>
<div class="panels" id="panels"></div>
<div class="foot" id="foot"></div>
<script>
const D = /*DATA*/null;
const f = (v) => (v >= 1000 ? v.toFixed(0) : v >= 10 ? v.toFixed(2) : v >= 0.1 ? v.toFixed(4) : v.toPrecision(4));
const sg = (v, d = 1) => (v >= 0 ? '+' : '') + v.toFixed(d);
document.getElementById('coin').textContent = D.coin + '  ' + f(D.price);
const call = document.getElementById('call'); call.textContent = D.verdict.text; call.className = 'call ' + (D.verdict.side || 'NONE');
document.getElementById('why').textContent = D.verdict.why + '   ·   max ' + D.maxLev + 'x   ·   ' + D.made;
const tag = (m) => m.state === 'LONG' ? '<span class="tag LONG">LONG</span>' : m.state === 'SHORT' ? '<span class="tag SHORT">SHORT</span>' : `<span class="${m.state === 'CHOP' ? 'd' : m.dir > 0 ? 'g' : 'r'}">${m.state}</span>`;
let h = `<tr><th>tf</th><th>read</th><th>push</th><th>clean</th><th>expand</th><th>vol</th><th>streak</th><th>leg move</th><th>paid @${D.maxLev}x</th><th>worst dip</th><th>dip @${D.maxLev}x</th><th></th></tr>`;
for (const tf of ['5m', '15m', '1h', '4h']) { const m = D.by[tf]; if (!m) continue; const c = m.dir > 0 ? 'g' : 'r';
  h += `<tr><td>${tf}</td><td>${tag(m)}</td><td class="${c}">${sg(m.push)}</td><td>${(m.clean * 100).toFixed(0)}%</td><td class="${m.expand >= 1.3 ? 'y' : ''}">${m.expand.toFixed(1)}x</td><td class="${m.vol >= 1.5 ? 'y' : ''}">${m.vol.toFixed(1)}x</td><td class="${m.streak > 0 ? 'g' : 'r'}">${Math.abs(m.streak)} ${m.streak > 0 ? 'up' : 'dn'}</td><td class="${c}">${sg(m.movePct, 2)}%</td><td class="${c}">${m.dir > 0 ? '+' : '-'}${m.paidMax.toFixed(0)}%</td><td>${m.dipPct.toFixed(2)}%</td><td class="${m.dipMax <= D.sl ? 'g' : 'r'}">${m.dipMax.toFixed(0)}%</td><td class="y">${m.stretched ? 'STRETCHED' : ''}</td></tr>`; }
document.getElementById('board').innerHTML = h;
document.getElementById('foot').innerHTML = `Stop to ride the 15m leg: <span class="y">${D.ride.pct.toFixed(2)}%</span> of price = <span class="${D.ride.half <= D.sl ? 'g' : 'r'}">${D.ride.half.toFixed(0)}%</span> of margin at ${D.halfLev}x, <span class="${D.ride.max <= D.sl ? 'g' : 'r'}">${D.ride.max.toFixed(0)}%</span> at ${D.maxLev}x (your stop ${D.sl}%). &nbsp; Bright candle with a dot = impulse candle (1.5x normal size, closing at its end). Shaded band = the 8-candle leg. push = leg in normal-size candles; clean = straight-line %.`;
const wrap = document.getElementById('panels');
for (const P of D.panels) {
  const div = document.createElement('div'); div.className = 'p';
  div.innerHTML = `<h3>${P.tf} &nbsp; ${tag(P.m)} &nbsp; <span class="d">push ${sg(P.m.push)} · clean ${(P.m.clean * 100).toFixed(0)}% · expand ${P.m.expand.toFixed(1)}x</span></h3><canvas></canvas>`;
  wrap.appendChild(div); P.div = div;
}
for (const P of D.panels) {
  const div = P.div; const cv = div.querySelector('canvas'); const r = cv.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const W = r.width, H = r.height, padR = 62, volH = 70, top = 10, ch = H - volH - top - 8; const c = P.c, n = c.length;
  const hi = Math.max(...c.map((x) => x.h)), lo = Math.min(...c.map((x) => x.l)); const y = (p) => top + (hi - p) / (hi - lo || 1) * ch; const cw = (W - padR) / n;
  g.fillStyle = P.m.dir > 0 ? 'rgba(73,184,117,.09)' : 'rgba(223,46,46,.09)'; g.fillRect((n - 8) * cw, top, 8 * cw, ch + volH + 8);
  g.font = '11px Inter,system-ui,sans-serif'; g.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) { const p = lo + (hi - lo) * k / 5; g.strokeStyle = '#152037'; g.beginPath(); g.moveTo(0, y(p)); g.lineTo(W - padR, y(p)); g.stroke(); g.fillStyle = '#81899F'; g.fillText(f(p), W - padR + 6, y(p)); }
  const maxV = Math.max(...c.map((x) => x.v)) || 1;
  c.forEach((x, k) => {
    const up = x.c >= x.o, rng = x.h - x.l, pos = rng ? (x.c - x.l) / rng : .5; const imp = rng >= P.avgR * 1.5 && (pos >= .7 || pos <= .3); const small = rng < P.avgR * .6;
    const col = up ? (imp ? '#7CF0AE' : small ? '#2A6B47' : '#49B875') : (imp ? '#FF5C5C' : small ? '#7A2228' : '#DF2E2E'); const cx = k * cw + cw / 2;
    g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); g.moveTo(cx, y(x.h)); g.lineTo(cx, y(x.l)); g.stroke();
    g.fillStyle = col; const yt = y(Math.max(x.o, x.c)); g.fillRect(k * cw + cw * .18, yt, cw * .64, Math.max(1.5, y(Math.min(x.o, x.c)) - yt));
    if (imp) { g.beginPath(); g.arc(cx, up ? y(x.h) - 6 : y(x.l) + 6, 2.6, 0, 7); g.fill(); }
    g.globalAlpha = imp ? .9 : .45; g.fillRect(k * cw + cw * .18, H - 4 - x.v / maxV * volH, cw * .64, x.v / maxV * volH); g.globalAlpha = 1;
  });
  const py = y(c[n - 1].c); g.strokeStyle = '#61B8FF'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, py); g.lineTo(W - padR, py); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#61B8FF'; g.fillRect(W - padR + 2, py - 9, padR - 4, 18); g.fillStyle = '#060A17'; g.fillText(f(c[n - 1].c), W - padR + 6, py);
}
</script></body></html>
